name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/pakket_tracker/manifest.json
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.version' custom_components/pakket_tracker/manifest.json)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "Pakket Tracker NL ${tag}"
