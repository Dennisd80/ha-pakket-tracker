name: Sync wiki

on:
  push:
    branches:
      - main
    paths:
      - wiki/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Dennisd80/ha-pakket-tracker.wiki.git" published-wiki
          cp wiki/*.md published-wiki/
          cd published-wiki
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update wiki for Pakket Tracker NL 0.7.1"
          git push
